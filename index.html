  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <script>
    const setPWA = () => {
      const path = window.location.pathname;
      const isAdmin = path.startsWith('/admin') ||
        path.startsWith('/milano-secure-gate-99') ||
        path.startsWith('/milano-dashboard-vault-77');

      // Manifest
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = isAdmin ? '/admin-manifest.json' : '/manifest.json';
      document.head.appendChild(manifestLink);

      // Favicon - set BEFORE browser renders
      const iconLink = document.createElement('link');
      iconLink.rel = 'icon';
      iconLink.type = 'image/png';
      iconLink.href = isAdmin ? '/admin-icon-192.png' : '/favicon.ico.png';
      document.head.appendChild(iconLink);

      // Title
      document.title = isAdmin ? 'إعدادات ميلانو' : 'متجر ميلانو';
    };
    setPWA();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
